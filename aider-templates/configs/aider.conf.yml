---
# RouterAI (OpenAI-совместимый эндпоинт)
# openai-api-base: https://routerai.ru/api/v1
# openai-api-key: ${OPENAI_API_KEY}

# Основная модель
model: openai/deepseek/deepseek-v4.1-flash

# Weak model — для коммитов
weak-model: openai/z-ai/glm-5.3-flash

# Architect mode
architect: false
editor-model: openai/deepseek/deepseek-v4.1-flash
editor-edit-format: editor-diff

alias:
  # FAST
  - "fast:openai/deepseek/deepseek-v4.1-flash"
  - "fast-next:openai/qwen/qwen3-coder-next"
  - "fast-alt:openai/z-ai/glm-5.3-flash"
  - "fast-alt-next:openai/openai/gpt-6-luna-pro"
  - "fast-top:openai/xiaomi/mimo-v2.6-flash"
  - "fast-top-next:openai/google/gemini-3.8-flash"

  # REASON
  - "reason:openai/xiaomi/mimo-v2.6-pro"
  - "reason-next:openai/openai/gpt-6.1-sol"
  - "reason-alt:openai/google/gemini-3.1-pro-preview"
  - "reason-alt-next:openai/moonshotai/kimi-k3"
  - "reason-top:openai/anthropic/claude-opus-5.5"
  - "reason-top-next:openai/openai/gpt-6.1-sol-pro"

  # CODER
  - "coder:openai/deepseek/deepseek-v4-pro-0813"
  - "coder-next:openai/qwen/qwen3-coder-next"
  - "coder-alt:openai/meta/muse-spark-1.3"
  - "coder-alt-next:openai/openai/gpt-5.6-terra"
  - "coder-top:openai/anthropic/claude-opus-4.6"
  - "coder-top-next:openai/google/gemini-3.1-pro-preview"

  # LOCAL
  - "local:ollama_chat/qwen2.5-coder:3b"
  - "local-next:ollama_chat/qwen2.5-coder:7b"

  # PRO
  - "pro:openai/openai/gpt-6.1-sol-pro"
  - "pro-next:openai/anthropic/claude-opus-4.6"
  - "pro-alt:openai/google/gemini-3.1-pro-preview"
  - "pro-alt-next:openai/anthropic/claude-opus-5.5"
  - "pro-top:openai/openai/gpt-6-astra"
  - "pro-top-next:openai/anthropic/claude-fable-5.1"

  # space bunny
  - "sbunny:openrouter/stealth/space-bunny-alpha"

  # MiMo
  - "mimo:openrouter/xiaomi/mimo-v2.6-flash"

auto-commits: true
dirty-commits: true
analytics: false
show-diffs: true

attribute-co-authored-by: false
attribute-author: false
attribute-committer: false

chat-language: ru
commit-language: en

commit-prompt: |
  Generate a conventional commit message: <type>(<scope>): <description>

  Types: feat, fix, docs, chore, test, refactor
  Scopes: nvim, aider, config, prompts, stacks

  {language_instruction}

  Rules:
  - Imperative mood ("add" not "added").
  - Max 72 characters for description.
  - No additional text or explanations.

  Reply only with the commit message.

# Цвета интерфейса
user-input-color: "#a6e3a1"          # зелёный (твой ввод)
assistant-output-color: "#cdd6f4"    # светло-серый (ответы модели)
tool-output-color: "#89b4fa"         # синий (вывод инструментов)
tool-error-color: "#f38ba8"          # красный (ошибки)
tool-warning-color: "#f9e2af"        # жёлтый (предупреждения)

# Меню автодополнения
completion-menu-color: "#cdd6f4"             # обычный текст
completion-menu-bg-color: "#1e1e2e"          # фон меню
completion-menu-current-color: "#1e1e2e"     # текст выбранного
completion-menu-current-bg-color: "#89b4fa"  # фон выбранного

# Тема для кода
code-theme: monokai
